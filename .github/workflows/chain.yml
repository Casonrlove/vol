name: record-chain
on:
  schedule: [{cron: "20 20 * * 1-5"}]   # 16:20 ET weekdays (20:20 UTC; 21:20 UTC in winter — edit if it matters)
  workflow_dispatch:
permissions: {contents: write}
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: mkdir -p data && VOL_DB=data/chain.db python record_chain.py
      - run: |
          git config user.name github-actions && git config user.email actions@github.com
          git add data/chain.db && git commit -m "chain $(date -u +%F)" && git push || echo "no change"
